# Pre-commit hooks for Terraform code quality
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.103.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        exclude: '^(legacy-monolith/|examples/|aws-setup/|tfc-vault-hcp-demo/|vault-aws-demo/)'
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
        exclude: '^(legacy-monolith/|examples/|aws-setup/|tfc-vault-hcp-demo/|vault-aws-demo/)'
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
        exclude: '^(legacy-monolith/|examples/|aws-setup/|tfc-vault-hcp-demo/|vault-aws-demo/)'
      - id: terraform_trivy
        args:
          - --args=--format=json
          - --args=--skip-dirs="**/.devcontainer"
          - --args=--skip-dirs="**/legacy-monolith"
          - --args=--skip-dirs="**/examples"
          - --args=--skip-dirs="**/aws-setup"
          - --args=--tf-exclude-downloaded-modules=true
          - --args=--severity=CRITICAL,HIGH,MEDIUM

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
